name: E2E Smoke (real Tauri app)

# Los unit/smoke de Node no pueden ver el runtime Tauri: el puente de plugins
# (src/bridge/tauri-bridge.mjs) y el modo 'tauri' de AppStorage solo se
# comprueban contra la app compilada corriendo en WebView2 de verdad. Este job
# es el unico que puede decir "la persistencia real funciona", y existe para que
# el fallback silencioso a localStorage no pueda volver sin que se note.

on:
  push:
    branches: [master, main]
    # El smoke compila Rust y WebView2 (~9 min de runner Windows, que se cobra
    # doble que Linux). Docs y artefactos de openspec no pueden romper el
    # runtime; ci.yml si corre en esos commits. workflow_dispatch sigue
    # disponible para forzarlo cuando hace falta.
    paths-ignore:
      - "**.md"
      - "openspec/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "openspec/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-windows:
    name: Persistencia real (Windows + WebView2 + CDP)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node >=22: el harness usa el WebSocket global de la plataforma. Con 20 el
      # runner llegaba a descubrir el target CDP y reventaba con
      # 'WebSocket is not defined'. La suite de tests sigue en 20 en ci.yml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # e2e:build = --no-bundle (no exige los secrets de firma del updater, que
      # viven solo en release.yml) + src-tauri/tauri.e2e.conf.json.
      #
      # Ese config extra es obligatorio, no un lujo: wry crea el entorno de
      # WebView2 pasando su propio additionalBrowserArgs, y con esa opcion presente
      # WebView2 IGNORA WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS. Las dos primeras
      # corridas del job lo probaron: binario construido, proceso vivo, y el
      # puerto 9222 cerrado durante 60s. Los args van aca y no en tauri.conf.json
      # porque distribuir un binario con DevTools abierto deja que cualquier
      # proceso local lea y escriba los datos de la app.
      #
      # Si se bumpéa el identifier en tauri.conf.json, actualizarlo aca tambien:
      # el schema raiz lo exige (Config.required) y un valor distinto cambiaria el
      # $APPDATA que prueba el smoke.
      - name: Build the app binary (with CDP browser args)
        run: npm run e2e:build

      - name: E2E smoke over CDP
        run: node scripts/e2e-smoke.js

      # Si falla, sin evidencia no se puede distinguir "el bridge no cargo" de
      # "WebView2 no levanto en el runner".
      - name: Leave evidence on failure
        if: failure()
        run: |
          echo "--- dist/vendor/tauri-bridge.js ---"
          if (Test-Path dist/vendor/tauri-bridge.js) {
            Get-Item dist/vendor/tauri-bridge.js | Select-Object Length, FullName
            Select-String -Path dist/index.html -Pattern 'tauri-bridge' -SimpleMatch
          } else {
            echo "NO EXISTE dist/vendor/tauri-bridge.js"
          }
          echo "--- binario ---"
          Get-ChildItem src-tauri/target/release/*.exe | Select-Object Name, Length
        shell: pwsh
