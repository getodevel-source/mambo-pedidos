name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Install npm dependencies
        run: npm ci

      - name: Check synchronized version
        run: npm run check:version

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint JavaScript
        run: npm run lint --if-present

      - name: Verify JS syntax
        run: |
          for f in src/js/*.js scripts/*.js scripts/quality/*.js; do
            node --check "$f" || exit 1
          done

  layout-audit:
    name: Layout audit (frontend, all viewport tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Install chromium (layout audit)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium
      - name: Build frontend
        run: npm run build:frontend
      - name: Run layout audit
        run: |
          [ -x /usr/bin/chromium ] || { echo "no /usr/bin/chromium"; exit 1; }
          npm run layout-audit
