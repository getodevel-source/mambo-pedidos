name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Install npm dependencies
        run: npm ci

      - name: Check synchronized version
        run: npm run check:version

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint JavaScript
        run: npm run lint --if-present

      - name: Verify JS syntax
        run: |
          for f in src/js/*.js scripts/*.js scripts/quality/*.js; do
            node --check "$f" || exit 1
          done

  layout-audit:
    name: Layout audit (frontend, all viewport tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      # 'apt-get install chromium' en runners ubuntu-24.04 instala el wrapper de
      # snap, cuyo backend (api.snapcraft.io) falla en CI con HTTP 408/timeout
      # (visto en el gate CI del release v2.2.4). Playwright baja su propio
      # Chromium con las libs del sistema incluidas (--with-deps).
      - name: Install Chromium for layout audit (Playwright, no snap)
        run: npx -y playwright@1.62.1 install --with-deps chromium
      - name: Build frontend
        run: npm run build:frontend
      - name: Run layout audit
        run: |
          CHROME=$(ls -d "$HOME/.cache/ms-playwright"/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)
          [ -n "$CHROME" ] || { echo "chromium no encontrado en ~/.cache/ms-playwright"; exit 1; }
          echo "chromium: $CHROME"
          PLAYWRIGHT_CHROMIUM="$CHROME" npm run layout-audit
