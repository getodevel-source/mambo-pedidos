name: Build & Release Mambo Pedidos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.1.0). Leave empty to skip release creation.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Install npm dependencies
        run: npm ci

      - name: Check synchronized version
        run: npm run check:version

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup signing key
        shell: bash
        env:
          TAURI_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_KEY_SECRET" ] || [ -z "$TAURI_KEY_PASSWORD_SECRET" ]; then
            echo "ERROR: TAURI signing secrets are required for release builds."
            exit 1
          fi
          key=$(printf '%s' "$TAURI_KEY_SECRET" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=dev-build" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'Mambo Pedidos ${{ steps.tag.outputs.name }}'
          releaseBody: 'Instaladores nativos de Mambo Pedidos para Windows (.exe / .msi), Linux (.AppImage / .deb) y macOS. El actualizador automático in-place descarga solo el parche firmado sin desinstalar.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  verify-latest:
    name: Verify latest.json (updater URLs + signatures)
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Verify updater manifest for all platforms
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "master" ]; then TAG=$(node -p "require('./package.json').version" | sed 's/^/v/'); fi
          node scripts/verify-latest.js "$TAG"

  visual-smoke-linux:
    name: Visual smoke (Linux, real binary under Xvfb)
    runs-on: ubuntu-22.04
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb imagemagick python3-pil
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend + binary (no bundle)
        run: |
          npm run build:frontend
          npm run e2e:build
      - name: Run visual smoke under Xvfb (GDK_SCALE=1)
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 scripts/visual-smoke.py launch src-tauri/target/release/mambo-pedidos --seconds 16

  visual-smoke-macos:
    name: Visual smoke (macOS, real binary)
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend + binary (no bundle)
        run: |
          npm run build:frontend
          npm run e2e:build
      - name: Run visual smoke (process alive + screenshot)
        run: |
          python3 scripts/visual-smoke.py launch src-tauri/target/release/mambo-pedidos --seconds 15
