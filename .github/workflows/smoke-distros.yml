name: "Smoke Distros — AppImage del release en ubuntu/debian/fedora"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag del release a probar (ej: v2.2.7). Vacío = latest'
        required: false
        default: ''

jobs:
  distro-smoke:
    name: ${{ matrix.image }} — AppImage arranca y pinta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            pkg: "curl xvfb imagemagick python3 python3-pil libwebkit2gtk-4.1-0 libgtk-3-0"
            install: apt-get update && apt-get install -y
          - image: debian:12
            pkg: "curl xvfb imagemagick python3 python3-pil libwebkit2gtk-4.1-0 libgtk-3-0"
            install: apt-get update && apt-get install -y
          - image: fedora:41
            pkg: "curl xorg-x11-server-Xvfb ImageMagick python3 python3-pillow webkit2gtk4.1 gtk3"
            install: dnf install -y
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke dependencies
        run: |
          ${{ matrix.install }} ${{ matrix.pkg }}
      - name: Download the released AppImage
        run: |
          TAG="${{ inputs.tag_name || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
              TAG="${{ inputs.tag_name || github.event.release.tag_name }}"
              if [ -z "$TAG" ]; then
                TAG="$(python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('https://api.github.com/repos/getodevel-source/mambo-pedidos/releases/latest'))['tag_name'])" 2>/dev/null || echo v2.2.6)"
              fi
              TARGET="${TAG#v}"
              # Los assets del release llegan ~10 min despues del evento release,
              # y el latest.json anuncia el TAG solo cuando estan subidos: esperar
              # evita la carrera de tiempo que rompio el smoke del 2.2.15.
              for i in $(seq 1 60); do
                v=$(curl -fsL --connect-timeout 20 https://github.com/getodevel-source/mambo-pedidos/releases/latest/download/latest.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
                if [ "$v" = "$TARGET" ]; then echo "latest.json ready: $v"; break; fi
                echo "waiting for latest.json=$TARGET (now $v) — attempt $i"
                sleep 20
              done
          curl -fL --retry 6 --retry-delay 30 --retry-all-errors -o mambo.AppImage \
            "https://github.com/getodevel-source/mambo-pedidos/releases/download/${TAG}/Mambo.Pedidos_${TAG#v}_amd64.AppImage"
          chmod +x mambo.AppImage
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Visual smoke (AppImage real, extracted, GDK_SCALE=1)
        run: |
          # sin FUSE en contenedores: APPIMAGE_EXTRACT_AND_RUN extrae y ejecuta
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1600x1000x24" \
            python3 ./scripts/visual-smoke.py launch ./mambo.AppImage --seconds 20